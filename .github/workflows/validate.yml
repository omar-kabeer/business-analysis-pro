name: Validate OS

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Validate skills and templates (structure + house style)
        run: npm run check

      - name: Build the distributable plugin
        run: npm run build:plugin

      - name: Ensure the plugin is in sync with the source
        run: |
          if ! git diff --exit-code -- plugin; then
            echo "plugin/ is out of date. Run 'npm run build:plugin' and commit the result."
            exit 1
          fi
